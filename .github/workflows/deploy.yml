name: CI/CD — Test & Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v

  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DADATA_API_KEY: ${{ secrets.DADATA_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: TELEGRAM_BOT_TOKEN,DADATA_API_KEY
          script: |
            set -e

            cd /opt/docgen

            # Pull latest code
            echo "📥 Pulling latest changes..."
            git pull origin main

            # Create .env from secrets
            echo "🔧 Writing .env..."
            printf 'TELEGRAM_BOT_TOKEN=%s\nDADATA_API_KEY=%s\n' \
              "$TELEGRAM_BOT_TOKEN" "$DADATA_API_KEY" > .env

            # Rebuild and restart changed containers
            echo "🐳 Building and deploying containers..."
            docker compose up --build -d

            # Cleanup old images
            echo "🧹 Cleaning up old Docker images..."
            docker system prune --force

            # Health check
            echo "❤️ Health check..."
            sleep 5
            if curl -sf http://localhost:8000/api/contracts/types > /dev/null; then
              echo "✅ API is healthy!"
            else
              echo "⚠️ API health check failed, checking logs..."
              docker compose logs --tail=20 api
              exit 1
            fi

            echo "🎉 Deployment complete!"
